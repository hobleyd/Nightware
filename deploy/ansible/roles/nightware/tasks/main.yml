---
# Deploys deploy/docker-compose.yml (with the `api` profile) from a checkout and
# runs its configure scripts. Every step converges, so re-running is safe.
# Needs Docker Engine with the compose plugin; the remote user must be able to
# run docker (in the docker group).

- name: Install what the configure scripts use
  ansible.builtin.package:
    name: [git, curl, jq, openssl]
  become: true

- name: Create the checkout's directory
  ansible.builtin.file:
    path: "{{ nightware_dir }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    mode: "0755"
  become: true

- name: Check out Nightware
  ansible.builtin.git:
    repo: "{{ nightware_repo }}"
    dest: "{{ nightware_dir }}"
    version: "{{ nightware_version }}"
  register: nightware_checkout

- name: Render the production realm
  # Keycloak imports it only into an empty database; a later realm change goes
  # through the admin console or API.
  ansible.builtin.command:
    argv:
      - jq
      - "{{ lookup('ansible.builtin.file', 'production-realm.jq') }}"
      - "{{ nightware_dir }}/deploy/keycloak/nightware-realm.json"
  register: nightware_realm
  changed_when: false

- name: Deploy the production realm
  ansible.builtin.copy:
    content: "{{ nightware_realm.stdout }}\n"
    dest: "{{ nightware_dir }}/deploy/keycloak/nightware-realm.production.json"
    mode: "0644"

# stalwart/configure.sh mints the console's Stalwart API key into deploy/.env.
# The template below replaces that file, so carry the key over, or every run
# would mint a new one.
- name: Read deploy/.env
  ansible.builtin.slurp:
    src: "{{ nightware_dir }}/deploy/.env"
  register: nightware_dotenv
  failed_when: false
  no_log: true

- name: Keep the console's Stalwart API key
  ansible.builtin.set_fact:
    nightware_stalwart_key: "{{ nightware_dotenv_text | regex_search('(?m)^STALWART_MANAGEMENT_API_KEY=(.*)$', '\\1') | default([''], true) | first }}"
    nightware_stalwart_key_id: "{{ nightware_dotenv_text | regex_search('(?m)^STALWART_MANAGEMENT_API_KEY_ID=(.*)$', '\\1') | default([''], true) | first }}"
  vars:
    nightware_dotenv_text: "{{ nightware_dotenv.content | default('') | b64decode }}"
  no_log: true

- name: Write deploy/.env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ nightware_dir }}/deploy/.env"
    mode: "0600"
  no_log: true

- name: Build the façade and the admin console from a new checkout
  ansible.builtin.command: docker compose --profile api build nightware-api nightware-admin
  args:
    chdir: "{{ nightware_dir }}/deploy"
  when: nightware_checkout is changed

- name: Bring up the stack
  ansible.builtin.command: docker compose --profile api up -d --wait
  args:
    chdir: "{{ nightware_dir }}/deploy"
  register: nightware_up
  changed_when: "'Started' in nightware_up.stderr or 'Recreated' in nightware_up.stderr"

- name: Configure Keycloak for the façade
  ansible.builtin.command: "{{ nightware_dir }}/deploy/keycloak/configure.sh"
  changed_when: false

# Created once, with a temporary password Keycloak makes them change at first
# sign-in; nothing about an existing user is touched. Before
# configure-console.sh, which makes the admin: true ones global administrators.
- name: Create Nightware's users in Keycloak
  when: not ansible_check_mode and nightware_users | length > 0
  module_defaults:
    ansible.builtin.uri:
      # Through Caddy on this host, whatever DNS says; the certificate is for
      # the public name, and the connection never leaves the host.
      validate_certs: false
      headers:
        Host: "{{ nightware_public_host }}"
  block:
    - name: Sign in to Keycloak as its admin
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ nightware_https_port }}/auth/realms/master/protocol/openid-connect/token"
        method: POST
        body_format: form-urlencoded
        body:
          client_id: admin-cli
          grant_type: password
          username: admin
          password: "{{ nightware_keycloak_admin_password }}"
      register: nightware_kc_admin
      no_log: true

    - name: Look up Nightware's users
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ nightware_https_port }}/auth/admin/realms/nightware/users?exact=true&username={{ item.username | urlencode }}"
        headers:
          Host: "{{ nightware_public_host }}"
          Authorization: "Bearer {{ nightware_kc_admin.json.access_token }}"
      loop: "{{ nightware_users }}"
      loop_control:
        label: "{{ item.username }}"
      register: nightware_existing

    - name: Create the missing ones
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ nightware_https_port }}/auth/admin/realms/nightware/users"
        method: POST
        headers:
          Host: "{{ nightware_public_host }}"
          Authorization: "Bearer {{ nightware_kc_admin.json.access_token }}"
        body_format: json
        body:
          username: "{{ item.item.username }}"
          email: "{{ item.item.email }}"
          emailVerified: true
          firstName: "{{ item.item.first_name }}"
          lastName: "{{ item.item.last_name }}"
          enabled: true
          credentials:
            - type: password
              value: "{{ nightware_user_initial_password }}"
              temporary: true
        status_code: 201
      loop: "{{ nightware_existing.results }}"
      loop_control:
        label: "{{ item.item.username }}"
      when: item.json | length == 0
      changed_when: true
      no_log: true

# configure-console.sh: the console's client, MFA flow, roles, default entity,
# global admins, and Grafana's client. stalwart/configure.sh makes Keycloak
# Stalwart's directory, creates the mailboxes and the console's Stalwart key.
# nextcloud/configure.sh: user_oidc, Nextcloud Office and the console's account.
- name: Configure the console, Grafana, Stalwart and Nextcloud
  ansible.builtin.command: "{{ nightware_dir }}/deploy/{{ item }}"
  loop:
    - keycloak/configure-console.sh
    - stalwart/configure.sh
    - nextcloud/configure.sh
  changed_when: false

# A key minted just now is in deploy/.env; compose recreates the console when
# its environment changed, and leaves it alone otherwise.
- name: Give the admin console its Stalwart API key
  ansible.builtin.command: docker compose --profile api up -d nightware-admin
  args:
    chdir: "{{ nightware_dir }}/deploy"
  register: nightware_admin_up
  changed_when: "'Recreated' in nightware_admin_up.stderr"
