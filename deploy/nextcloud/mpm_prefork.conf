# Apache prefork for Nextcloud: mounted over the image's
# /etc/apache2/mods-available/mpm_prefork.conf (here and in the live stack's
# compose file).
#
# The image keeps 5-10 idle children and forks more at 1, 2, 4, ... per second,
# so a burst of more than 10 concurrent requests (a façade instance polling for
# several devices at once) waited up to 4 s for workers. 20 idle children cost
# about 13 MB each beyond the shared code.
<IfModule mpm_prefork_module>
	StartServers		20
	MinSpareServers		20
	MaxSpareServers		40
	MaxRequestWorkers	150
	MaxConnectionsPerChild	0
</IfModule>
